<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogicFlow - Text to Mermaid Flowchart</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Mermaid.js -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
    <script>
        mermaid.initialize({ startOnLoad: false, theme: 'dark' });
    </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-start p-6">

    <div class="w-full max-w-3xl bg-slate-900 border border-slate-800 rounded-2xl shadow-xl p-8">
        <h1 class="text-2xl font-bold text-cyan-400 mb-2">LogicFlow AI</h1>
        <p class="text-slate-400 text-sm mb-6">Transform your descriptions into professional Mermaid flowcharts instantly.</p>

        <!-- Input Section -->
        <div class="space-y-4">
            <textarea id="promptInput" rows="4" 
                class="w-full bg-slate-950 border border-slate-700 rounded-lg p-3 text-slate-100 focus:outline-none focus:border-cyan-500 transition resize-none" 
                placeholder="Describe your workflow here... (e.g., User logs in, system verifies credentials, redirects to dashboard)"></textarea>

            <div class="flex items-center justify-between">
                <!-- Voice Input Button -->
                <button id="micBtn" type="button" 
                    class="flex items-center gap-2 bg-slate-800 hover:bg-slate-700 text-slate-300 px-4 py-2 rounded-lg text-sm font-medium transition border border-slate-700 cursor-pointer">
                    <svg id="micIcon" class="w-4 h-4 text-cyan-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 100-6 3 3 0 000 6z"></path>
                    </svg>
                    <span id="micText">Voice Input</span>
                </button>

                <!-- Generate Button -->
                <button id="generateBtn" 
                    class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-semibold px-6 py-2 rounded-lg transition shadow-md cursor-pointer">
                    Generate Flowchart
                </button>
            </div>
        </div>

        <!-- Loading State -->
        <div id="loading" class="hidden text-center py-6 text-cyan-400 animate-pulse">
            Generating your flowchart...
        </div>

        <!-- Output Section -->
        <div id="outputContainer" class="mt-8 hidden">
            <h2 class="text-lg font-semibold text-slate-300 mb-3">Generated Workflow</h2>
            <div class="bg-slate-950 border border-slate-800 rounded-lg p-6 overflow-x-auto flex justify-center">
                <div class="mermaid" id="mermaidOutput"></div>
            </div>
        </div>
    </div>

    <script>
        const generateBtn = document.getElementById('generateBtn');
        const promptInput = document.getElementById('promptInput');
        const loading = document.getElementById('loading');
        const outputContainer = document.getElementById('outputContainer');
        const mermaidOutput = document.getElementById('mermaidOutput');
        const micBtn = document.getElementById('micBtn');
        const micText = document.getElementById('micText');

        // --- Voice Recognition (Web Speech API) ---
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'en-US';

            let isListening = false;

            micBtn.addEventListener('click', () => {
                if (!isListening) {
                    recognition.start();
                } else {
                    recognition.stop();
                }
            });

            recognition.onstart = () => {
                isListening = true;
                micText.textContent = "Listening...";
                micBtn.classList.add('border-cyan-500', 'bg-slate-700');
            };

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                promptInput.value += (promptInput.value ? ' ' : '') + transcript;
            };

            recognition.onerror = (event) => {
                console.error("Speech recognition error:", event.error);
                micText.textContent = "Voice Input";
                isListening = false;
                micBtn.classList.remove('border-cyan-500', 'bg-slate-700');
            };

            recognition.onend = () => {
                isListening = false;
                micText.textContent = "Voice Input";
                micBtn.classList.remove('border-cyan-500', 'bg-slate-700');
            };
        } else {
            micBtn.style.display = 'none';
        }

        // --- Flowchart Generation ---
        generateBtn.addEventListener('click', async () => {
            const prompt = promptInput.value.trim();
            if (!prompt) return;

            loading.classList.remove('hidden');
            outputContainer.classList.add('hidden');

            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt })
                });

                const data = await response.json();
                if (data.mermaidCode) {
                    mermaidOutput.removeAttribute('data-processed');
                    mermaidOutput.textContent = data.mermaidCode;
                    outputContainer.classList.remove('hidden');
                    await mermaid.run({ nodes: [mermaidOutput] });
                } else {
                    alert('Failed to generate flowchart.');
                }
            } catch (err) {
                console.error(err);
                alert('Server error.');
            } finally {
                loading.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
