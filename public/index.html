<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>LogicFlow AI - Workflow Engine</title>
  
  <!-- Tailwind CSS & Fonts -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Geist:wght@400;600&display=swap" rel="stylesheet"/>
  
  <!-- Mermaid.js for Dynamic Graph Rendering -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>

  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#3525cd",
            "primary-container": "#4f46e5",
            "on-primary": "#ffffff",
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#f1f3ff",
            "surface-dim": "#d3daef",
            "background": "#f9f9ff",
            "on-background": "#141b2b",
            "on-surface": "#141b2b",
            "on-surface-variant": "#464555",
            "outline": "#777587",
            "outline-variant": "#c7c4d8",
          },
          spacing: {
            "gutter": "16px",
            "sidebar-width": "320px",
          },
          fontFamily: {
            "display": ["Inter"],
            "body-md": ["Inter"],
            "mono-sm": ["Geist"]
          }
        }
      }
    }
  </script>
  <style>
    .dot-grid {
      background-color: #F9FAFB;
      background-image: radial-gradient(circle, #E5E7EB 1px, transparent 1px);
      background-size: 24px 24px;
    }
  </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col antialiased"></body>
  <!-- Header / Navbar -->
  <header class="bg-surface-container-lowest border-b border-outline-variant flex justify-between items-center h-14 px-gutter w-full fixed top-0 z-50">
    <div class="flex items-center gap-4">
      <div class="font-display text-xl font-bold text-primary tracking-tighter shrink-0">
        LogicFlow AI
      </div>
      <div class="h-6 w-px bg-outline-variant mx-2"></div>
      <span class="text-sm font-semibold text-on-surface">AI Workflow Builder</span>
    </div>

    <div class="flex items-center gap-3">
      <span id="statusIndicator" class="text-xs text-outline italic">Ready</span>
    </div>
  </header>

  <div class="flex flex-1 pt-14 h-screen">
    <!-- Sidebar / Prompt Input -->
    <aside class="bg-surface-container-lowest border-r border-outline-variant fixed left-0 top-14 h-[calc(100vh-3.5rem)] w-sidebar-width flex flex-col p-4 z-40">
      <div class="mb-4">
        <h2 class="font-semibold text-lg text-on-surface mb-1">Workflow Engine</h2>
        <p class="text-xs text-on-surface-variant">Natural Language SOP Logic Extraction</p>
      </div>

      <!-- Input Area -->
      <div class="mb-4 flex-1 flex flex-col gap-4">
        <div class="relative h-48">
          <textarea 
            id="promptInput"
            class="w-full h-full resize-none border border-outline-variant rounded-lg focus:border-primary bg-transparent p-3 text-sm text-on-surface placeholder:text-outline outline-none transition-all"
            placeholder="Describe your business process or SOP... (e.g., When an operational customer service escalation flowchart is requested...)"
          ></textarea>
        </div>

        <div>
          <h3 class="text-xs font-semibold text-outline mb-2 uppercase tracking-wider">Quick Starts</h3>
          <div class="flex flex-wrap gap-2">
            <button onclick="setPrompt('When an invoice is received, check if amount > $10,000. If yes, request VP approval, otherwise route to accounting.')" class="px-3 py-1 rounded-full border border-outline-variant text-xs text-on-surface-variant hover:bg-surface-container-low transition-colors">
              Invoice Approval
            </button>
            <button onclick="setPrompt('When a new support ticket arrives, classify priority. High priority alerts senior engineer; low priority assigns to queue.')" class="px-3 py-1 rounded-full border border-outline-variant text-xs text-on-surface-variant hover:bg-surface-container-low transition-colors">
              IT Ticketing
            </button>
          </div>
        </div>
      </div>

      <!-- Action Button -->
      <button 
        id="generateBtn"
        onclick="generateWorkflow()"
        class="w-full bg-primary text-on-primary hover:bg-primary-container font-semibold py-3 rounded-lg shadow-sm transition-all flex justify-center items-center gap-2 mt-auto"
      >
        <span class="material-symbols-outlined text-[18px]">auto_awesome</span>
        Generate Workflow
      </button>
    </aside>

    <!-- Main Canvas Area -->
    <main class="flex-1 ml-sidebar-width relative dot-grid overflow-auto bg-[#F9FAFB] p-8 flex flex-col items-center justify-start">
      
      <!-- Mermaid Canvas Card -->
      <div class="w-full max-w-4xl bg-white border border-outline-variant rounded-xl shadow-sm p-6 mb-6">
        <h3 class="text-sm font-semibold text-outline mb-4">Flowchart Visualization</h3>
        <div id="mermaidDiagram" class="mermaid flex justify-center overflow-x-auto py-4">
          graph TD
            A[Start] --> B[Enter SOP Prompt]
            B --> C[Click Generate Workflow]
        </div>
      </div>

      <!-- JSON Output View -->
      <div class="w-full max-w-4xl bg-white border border-outline-variant rounded-xl shadow-sm p-6">
        <h3 class="text-sm font-semibold text-outline mb-2">Structured JSON Schema</h3>
        <pre id="jsonOutput" class="bg-slate-950 text-emerald-400 p-4 rounded-lg font-mono text-xs overflow-x-auto max-h-60">// Output JSON will render here...</pre>
      </div>

    </main>
  </div>

  <script>
    // Initialize Mermaid with a clean professional theme
    mermaid.initialize({ startOnLoad: false, theme: 'neutral' });

    function setPrompt(text) {
      document.getElementById('promptInput').value = text;
    }

    async function generateWorkflow() {
      const promptInput = document.getElementById('promptInput').value.trim();
      const statusIndicator = document.getElementById('statusIndicator');
      const generateBtn = document.getElementById('generateBtn');
      const jsonOutput = document.getElementById('jsonOutput');
      const mermaidDiagram = document.getElementById('mermaidDiagram');

      if (!promptInput) {
        alert('Please enter a workflow description first.');
        return;
      }

      // UI Loading State
      statusIndicator.textContent = '⏳ Parsing SOP...';
      generateBtn.disabled = true;
      generateBtn.classList.add('opacity-50');

      try {
        const response = await fetch('/workflow/detect', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: promptInput })
        });

        const data = await response.json();

        if (response.ok) {
          jsonOutput.textContent = JSON.stringify(data, null, 2);

          // Build professional Mermaid diagram syntax dynamically
          let syntax = 'flowchart TD\n';
          
          // Style classes for professional color coding
          syntax += '  classDef triggerStyle fill:#d1fae5,stroke:#059669,stroke-width:2px,color:#065f46;\n';
          syntax += '  classDef transformStyle fill:#fef3c7,stroke:#d97706,stroke-width:2px,color:#92400e;\n';
          syntax += '  classDef actionStyle fill:#e0e7ff,stroke:#4f46e5,stroke-width:2px,color:#3730a3;\n';

          if (data.nodes && Array.isArray(data.nodes)) {
            data.nodes.forEach(node => {
              // Format node shape: use diamond {} for decision transforms, rectangle [] for standard nodes
              let shapeOpen = '[';
              let shapeClose = ']';
              let styleClass = 'actionStyle';

              if (node.type === 'trigger') {
                styleClass = 'triggerStyle';
              } else if (node.type === 'transform' || node.label.toLowerCase().includes('is ') || node.label.includes('?')) {
                shapeOpen = '{';
                shapeClose = '}';
                styleClass = 'transformStyle';
              }

              // Clean text for Mermaid syntax safety
              const cleanLabel = node.label.replace(/"/g, "'");
              syntax += `  ${node.id}${shapeOpen}"${cleanLabel}"${shapeClose}:::${styleClass}\n`;
            });
          }

          if (data.edges && Array.isArray(data.edges)) {
            data.edges.forEach(edge => {
              syntax += `  ${edge.source} --> ${edge.target}\n`;
            });
          }

          // Render updated Mermaid graph
          mermaidDiagram.removeAttribute('data-processed');
          mermaidDiagram.innerHTML = syntax;
          await mermaid.run({ nodes: [mermaidDiagram] });

          statusIndicator.textContent = '✅ Workflow generated!';
        } else {
          jsonOutput.textContent = JSON.stringify(data, null, 2);
          statusIndicator.textContent = '❌ Generation failed.';
        }
      } catch (err) {
        jsonOutput.textContent = 'Error: ' + err.message;
        statusIndicator.textContent = '❌ Connection error.';
      } finally {
        generateBtn.disabled = false;
        generateBtn.classList.remove('opacity-50');
      }
    }
  </script>
</body>
</html>
